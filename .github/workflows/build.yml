name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E "^e: |error:|What went wrong|Could not|> Could|Execution failed|Unresolved|FAILURE" -A4 build.log | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectorRemote-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            helper/build/outputs/apk/debug/*.apk

      - name: Publish APK to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Projector Remote build ${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/*.apk
            helper/build/outputs/apk/debug/*.apk
